# Lokal utvikling og enkel produksjonskjøring.
#
# Klar for Railway/Fly.io/VPS: appene leser DATABASE_URL og REDIS_URL fra
# miljøet, så de samme imagene kjører der uten endring.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: social_engine
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly av: køen er arbeidsstate, ikke sannhetskilden. Sannheten
    # ligger i Postgres, og en tapt kø kan bygges opp igjen derfra.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: { context: ., dockerfile: Dockerfile }
    command: ["npm", "run", "worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/social_engine
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: Dockerfile }
    command: ["npm", "run", "api"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/social_engine
      REDIS_URL: redis://redis:6379
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
