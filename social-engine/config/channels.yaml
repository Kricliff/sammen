# Kanalkonfigurasjon.
#
# `language` er sannhetskilden for publiseringsspråk (ARCHITECTURE.md 9.4).
# `sharesAdRevenue` speiler funnene i MONETIZATION.md og styrer om
# Portfolio-agenten får lov til å forvente annonseinntekt fra kanalen.

channels:
  youtube:
    enabled: true
    language: en
    autopublishMode: manual
    maxPostsPerDay: 3
    sharesAdRevenue: true
    notes: >
      Eneste kanal med en åpen, søkbar vei til annonseinntekt for en skaper
      bosatt i Norge. Terskel: 1000 abonnenter + 10 mill. Shorts-visninger
      på 90 dager, eller 4000 visningstimer på 12 måneder.

  linkedin:
    enabled: true
    language: no
    autopublishMode: manual
    maxPostsPerDay: 1
    sharesAdRevenue: false
    notes: >
      Ingen annonseinntekt (BrandLink er invitasjonsbasert), men den korteste
      veien til coachinghenvendelser. Norsk språk fordi tjenesten selges i
      Norge. Verdien måles som revenue_events.type = 'lead'.

  instagram:
    enabled: true
    language: en
    autopublishMode: manual
    maxPostsPerDay: 2
    sharesAdRevenue: false
    notes: Monetisering uavklart for Norge. Behandles som rekkeviddekanal.

  facebook:
    enabled: true
    language: en
    autopublishMode: manual
    maxPostsPerDay: 2
    sharesAdRevenue: false
    notes: >
      Content Monetization er invitasjonsbasert og kan ikke planlegges mot.
      Mest tillatende AI-regler av alle kanalene. Gjenbruker YouTube-assetet.

  tiktok:
    enabled: false
    language: en
    autopublishMode: "off"
    maxPostsPerDay: 2
    sharesAdRevenue: false
    notes: >
      DEAKTIVERT I FASE 1. To grunner: Creator Rewards ser ikke ut til å være
      tilgjengelig i Norge (ingen direkte inntekt), og Content Posting API
      publiserer kun privat inntil klienten er godkjent i TikToks revisjon.
      Se MONETIZATION.md 3.2 og 3.3.
