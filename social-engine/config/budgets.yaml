# Harde budsjettak i NOK. Ved warnAtPct varsles eier. Ved 100 % stopper
# systemet all ny produksjon og fullfører kun det som allerede står i kø.
#
# Utgangspunktet er scenario B i UNIT_ECONOMICS.md 5.1: ~1 442 NOK/mnd ved
# 90 kortvideoer og 13 LinkedIn-innlegg. Månedstaket ligger over det med
# margin, men under scenario A (2 258), slik at taket faktisk blir bindende
# hvis kostnadene drifter oppover.

dailyCapNok: 70
weeklyCapNok: 500
monthlyCapNok: 2000
warnAtPct: 0.8
